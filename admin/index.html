<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zoca Sales Academy — Progress Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --maroon: #7a1c2e;
        --maroon-dark: #5c1322;
        --cream: #f7f1e6;
        --cream-deep: #efe6d4;
        --ink: #241a1c;
        --ink-soft: #5c4d50;
        --muted: #8a7b7e;
        --line: #e6dccb;
        --white: #fffdfa;
        --gold: #c89a3c;
        --green: #2e7d57;
        --green-soft: #e4f1ea;
        --red: #b23b3b;
        --shadow-sm: 0 1px 2px rgba(60, 20, 25, 0.08);
        --shadow-md: 0 6px 24px rgba(60, 20, 25, 0.1);
        --radius: 14px;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --display: "Fraunces", Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--ink);
        background: var(--cream);
        padding: 32px 28px 80px;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
      }
      .head {
        margin-bottom: 22px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 12px;
        font-weight: 700;
        color: var(--maroon);
      }
      h1 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
        margin: 6px 0 4px;
      }
      .lede {
        color: var(--ink-soft);
        margin: 0;
        max-width: 760px;
      }
      .banner {
        margin: 16px 0;
        padding: 12px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        border: 1px solid var(--line);
        background: var(--white);
      }
      .banner.warn {
        border-color: var(--gold);
        background: #fdf6e6;
      }
      .banner.err {
        border-color: var(--red);
        background: #f9eaea;
      }
      .stat-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin: 18px 0 24px;
      }
      .stat {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 18px;
        box-shadow: var(--shadow-sm);
      }
      .stat-num {
        font-family: var(--display);
        font-size: 28px;
        font-weight: 700;
        color: var(--maroon);
      }
      .stat-label {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .toolbar input {
        font: inherit;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--white);
        min-width: 240px;
      }
      .toolbar button {
        font: inherit;
        cursor: pointer;
        padding: 9px 14px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
      }
      .toolbar button:hover {
        border-color: var(--maroon);
        color: var(--maroon);
      }
      .spacer {
        flex: 1;
      }
      .updated {
        font-size: 12px;
        color: var(--muted);
      }
      .table-card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        padding: 11px 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      thead th {
        position: sticky;
        top: 0;
        background: var(--cream-deep);
        font-weight: 700;
        color: var(--ink-soft);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        cursor: pointer;
        user-select: none;
      }
      thead th.track-col {
        text-align: center;
      }
      thead th .arrow {
        opacity: 0.4;
        font-size: 10px;
      }
      tbody tr:hover {
        background: var(--cream);
      }
      .learner {
        min-width: 200px;
      }
      .learner .nm {
        font-weight: 600;
      }
      .learner .em {
        color: var(--muted);
        font-size: 12px;
      }
      td.track-cell {
        text-align: center;
        min-width: 64px;
      }
      .cellbar {
        display: inline-block;
        width: 46px;
        height: 6px;
        border-radius: 4px;
        background: var(--cream-deep);
        overflow: hidden;
        vertical-align: middle;
      }
      .cellbar > span {
        display: block;
        height: 100%;
        background: var(--maroon);
      }
      .cellnum {
        font-size: 11px;
        color: var(--ink-soft);
        display: block;
        margin-top: 3px;
      }
      .cellnum.cert {
        color: var(--green);
        font-weight: 700;
      }
      .overall {
        font-weight: 700;
      }
      .pillbar {
        display: inline-block;
        width: 90px;
        height: 8px;
        border-radius: 5px;
        background: var(--cream-deep);
        overflow: hidden;
        vertical-align: middle;
        margin-right: 8px;
      }
      .pillbar > span {
        display: block;
        height: 100%;
        background: var(--green);
      }
      .certs-badge {
        display: inline-block;
        min-width: 22px;
        text-align: center;
        padding: 2px 8px;
        border-radius: 20px;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 700;
        font-size: 12px;
      }
      .certs-badge.zero {
        background: var(--cream-deep);
        color: var(--muted);
      }
      .nodata {
        color: var(--muted);
        font-style: italic;
      }
      .seed-tag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--gold);
        font-weight: 700;
        margin-left: 6px;
      }
      .foot {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }
      .foot code {
        background: var(--white);
        padding: 1px 5px;
        border-radius: 5px;
        border: 1px solid var(--line);
      }
      @media (max-width: 720px) {
        .stat-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="eyebrow">Admin · no login</div>
        <h1>Training Progress Overview</h1>
        <p class="lede">
          Everyone onboarded to the Zoca Sales Academy and how far they've
          progressed across each track. Live, read-only — refreshes from the
          shared progress sheet each time you load this page.
        </p>
      </div>

      <div id="banner"></div>

      <div class="stat-row" id="stats"></div>

      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Filter by name or email…"
        />
        <button id="refresh">↻ Refresh</button>
        <div class="spacer"></div>
        <div class="updated" id="updated"></div>
      </div>

      <div class="table-card">
        <table id="grid">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="foot" id="foot"></div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
